# RK3506 MiniEVM (3x Cortex-A7, 256 MiB) network stack tuning.
#
# The mainline defaults are sized for desktop machines.  On a NAT router the
# socket buffers decide whether a 100 Mbit/s link is actually reached, so raise
# the defaults and the per-socket maxima together.

# Socket buffer defaults / maxima
net.core.rmem_default = 262144
net.core.wmem_default = 262144
net.core.rmem_max = 4194304
net.core.wmem_max = 4194304

# TCP autotuning range
net.ipv4.tcp_rmem = 4096 262144 4194304
net.ipv4.tcp_wmem = 4096 262144 4194304

# UDP sockets (DNS, VoIP, QUIC)
net.ipv4.udp_rmem_min = 16384
net.ipv4.udp_wmem_min = 16384

# Per-CPU backlog for bursts of small packets
net.core.netdev_max_backlog = 4096
net.core.somaxconn = 8192

# PLPMTUD: a lowered path MTU (PPPoE, tunnels) must not wedge a flow
net.ipv4.tcp_mtu_probing = 1
# Do not let the not-yet-sent queue grow without bound on slow readers
net.ipv4.tcp_notsent_lowat = 16384

# conntrack: 4096 entries is too small for a busy LAN
net.netfilter.nf_conntrack_max = 16384
